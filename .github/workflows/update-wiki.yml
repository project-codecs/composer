name: Force wiki update

on: ["workflow_dispatch"]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: 25

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Push
        run: ./gradlew :1.21.4:revalidateDocs # Only run on one instance
        env:
          WIKI_PUBLISH_KEY: ${{ secrets.WIKI_PUBLISH_KEY }}